name: Apply approved GCC landscape hero logo

on:
  push:
    paths:
      - '.github/workflows/apply-gcc-hero-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken hero logo with approved landscape logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/gcc-market-entry-guide.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''              <img
                src={path("/gcc-market-entry-brand.webp?v=20260921-hero")}
                alt="GCC Market Entry — Business, Jobs, Scholarships, Official Resources and Market Guides"
                className="mb-7 h-auto w-[min(300px,78vw)] rounded-[1.75rem] bg-white shadow-2xl"
                width={700}
                height={700}
              />'''
          new = '''              <img
                src={path("/gcc-market-entry-logo.svg?v=20260921-landscape")}
                alt="GCC Market Entry — Business, Jobs, Scholarships, Official Resources and Market Guides"
                className="mb-8 h-auto w-full max-w-[760px] rounded-[1.5rem] bg-white shadow-2xl"
                width={1600}
                height={800}
              />'''
          if old not in text:
              raise SystemExit('Expected hero logo block was not found; no changes made.')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit hero logo correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'GCC Market Entry Brand Update'
          git config user.email 'moesaffin@gmail.com'
          git add components/gcc-market-entry-guide.tsx
          git commit -m 'Use full landscape GCC logo above hero'
          git push origin HEAD:main
