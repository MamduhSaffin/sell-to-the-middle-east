name: Remove unapproved GCC visuals

on:
  push:
    paths:
      - '.github/workflows/cleanup-unapproved-visuals.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep approved GCC logo only
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          layout = Path('app/layout.tsx')
          s = layout.read_text(encoding='utf-8')
          s = re.sub(
              r'const socialImage = siteUrl \+ "[^"]+"',
              'const socialImage = siteUrl + "gcc-market-entry-logo-approved-green-gold-20260923.png?v=20260923-approved-drive-logo"',
              s,
              count=1,
          )
          s = re.sub(r'\n\s*width:\s*\d+,\n\s*height:\s*\d+,', '', s, count=1)
          s = re.sub(r'type:\s*"image/jpeg"', 'type: "image/png"', s, count=1)
          layout.write_text(s, encoding='utf-8')

          for name in ['app/page.tsx', 'app/en/page.tsx', 'app/bm/page.tsx', 'app/ar/page.tsx']:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = re.sub(r'^import \{ ApprovedHeroBanner \} from "@/components/approved-hero-banner"\n', '', t, flags=re.M)
              t = re.sub(r'\s*<ApprovedHeroBanner\s*/>\s*', '\n', t)
              p.write_text(t, encoding='utf-8')
          PY
          git rm -f --ignore-unmatch \
            public/images/gcc-market-entry-social.jpg \
            public/images/gcc-hero.png \
            public/images/social/gcc-market-entry-approved-banner.webp \
            public/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp \
            public/images/social/gcc-market-entry-share-1200x630.png \
            public/images/social/gcc-market-entry-whatsapp.jpg \
            public/images/social/gcc-banner.b64.1 \
            public/images/social/gcc-banner.b64.2 \
            public/images/social/gcc-banner.b64.3 \
            app/opengraph-image.png \
            app/twitter-image.png \
            components/approved-hero-banner.tsx
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Remove rejected GCC pictures and keep approved logo only'
          git push origin HEAD:main
