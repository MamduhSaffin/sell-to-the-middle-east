name: Apply approved GCC Market Entry logo

on:
  push:
    paths:
      - '.github/workflows/apply-approved-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible GCC logo references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/gcc-brand-logo.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/gcc-market-entry-header.svg?v=20260920-brand', '/gcc-market-entry-brand.webp?v=20260921-brand')
          text = text.replace('className={compact ? "h-10 w-auto max-w-[190px] sm:h-12 sm:max-w-[220px]" : "h-12 w-auto max-w-[220px] sm:h-14 sm:max-w-[260px]"}', 'className={compact ? "h-auto w-[128px] sm:w-[150px]" : "h-auto w-[160px] sm:w-[190px]"}')
          p.write_text(text, encoding='utf-8')

          p = Path('components/gcc-market-entry-guide.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/gcc-market-entry-logo.svg?v=20260920-hero', '/gcc-market-entry-brand.webp?v=20260921-hero')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit website logo update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'GCC Market Entry Brand Update'
          git config user.email 'mamduh@tgpugulf.com'
          git add components/gcc-brand-logo.tsx components/gcc-market-entry-guide.tsx
          git commit -m 'Use approved GCC Market Entry logo across website'
          git push origin HEAD:main
