name: Deploy GCC Market Entry to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_GA_ID: "G-SYBHPLSVCS"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Generate favicon and social preview
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p public/images/social
          rsvg-convert -w 512 -h 512 public/icon.svg -o public/apple-icon.png
          rsvg-convert -w 1200 -h 630 public/social-preview.svg -o public/images/social/gcc-market-entry-share-1200x630.png
          test -s public/apple-icon.png
          test -s public/images/social/gcc-market-entry-share-1200x630.png
          test -s public/images/social/gcc-market-entry-approved-banner.webp

      - name: Build static export
        run: pnpm build

      - name: Validate routes and fingerprint this release
        run: node scripts/verify-pages.mjs stamp ./out "$GITHUB_SHA" "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: https://gccmarketentry.me/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the release at the custom domain
        timeout-minutes: 15
        run: node scripts/verify-pages.mjs live "https://gccmarketentry.me/" "$GITHUB_SHA"
