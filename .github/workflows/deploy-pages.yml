name: Deploy GCC Market Entry to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_GA_ID: "G-SYBHPLSVCS"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Prepare approved hero, favicon and social preview
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p public/images/social

          # Rebuild the approved WebP from the repository's base64 parts.
          # This avoids serving the previously corrupted committed WebP asset.
          cat public/images/social/gcc-banner.b64.1 \
              public/images/social/gcc-banner.b64.2 \
              public/images/social/gcc-banner.b64.3 \
            | tr -d '\r\n' \
            | base64 --decode \
            > public/images/social/gcc-market-entry-approved-banner.webp

          test -s public/images/social/gcc-market-entry-approved-banner.webp
          file public/images/social/gcc-market-entry-approved-banner.webp

          # Normalize the social artwork to the official green + gold palette before rendering.
          sed -i 's/#123b2c/#064a38/g; s/#c59b4f/#d6a431/g; s/#8a6b2d/#b98216/g; s/#e0bf73/#f5d56d/g; s/#fbfaf4/#fffdf8/g' public/social-preview.svg

          rsvg-convert -w 512 -h 512 public/icon.svg -o public/apple-icon.png
          rsvg-convert -w 1200 -h 630 public/social-preview.svg -o public/images/social/gcc-market-entry-share-1200x630.png
          convert public/images/social/gcc-market-entry-approved-banner.webp -resize '1200x630^' -gravity center -extent 1200x630 -quality 92 public/images/social/gcc-market-entry-whatsapp.jpg

          # Next.js static export: use file-based static metadata images instead of runtime image routes.
          cp public/images/social/gcc-market-entry-share-1200x630.png app/opengraph-image.png
          cp public/images/social/gcc-market-entry-share-1200x630.png app/twitter-image.png

          test -s public/apple-icon.png
          test -s public/images/social/gcc-market-entry-share-1200x630.png
          test -s public/images/social/gcc-market-entry-whatsapp.jpg
          test -s app/opengraph-image.png
          test -s app/twitter-image.png

      - name: Build static export
        run: pnpm build

      - name: Validate routes and fingerprint this release
        run: node scripts/verify-pages.mjs stamp ./out "$GITHUB_SHA" "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: https://gccmarketentry.me/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the release at the custom domain
        timeout-minutes: 15
        run: node scripts/verify-pages.mjs live "https://gccmarketentry.me/" "$GITHUB_SHA"
