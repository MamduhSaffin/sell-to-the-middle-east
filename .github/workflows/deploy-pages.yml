name: Deploy GCC Market Entry to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_GA_ID: "G-SYBHPLSVCS"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Prepare approved green-gold logo, hero, favicon and social preview
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p public/images/social

          fetch_asset() {
            live_url="$1"
            fallback_url="$2"
            output="$3"
            if curl -fL --retry 2 --connect-timeout 10 "$live_url" -o "$output"; then
              echo "Recovered approved asset from the live site: $live_url"
            else
              echo "Seeding approved asset from the approved Drive source"
              curl -fL --retry 3 --connect-timeout 15 "$fallback_url" -o "$output"
            fi
            test -s "$output"
          }

          LOGO_LIVE="https://gccmarketentry.me/gcc-market-entry-logo-approved-green-gold-20260923.png"
          BANNER_LIVE="https://gccmarketentry.me/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp"
          FAVICON_LIVE="https://gccmarketentry.me/gcc-market-entry-favicon-approved-green-gold-20260923.png"

          LOGO_SEED='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1cb8-8211-aaeb-3ef6ecdd2e3e/raw?se=2026-09-23T01%3A09%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=56b54010-2624-5381-b259-eb21c7ae9285&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T22%3A02%3A54Z&ske=2026-09-23T22%3A02%3A54Z&sks=b&skv=2026-02-06&sig=ohMqL9zogXuA%2B8OjbJrH/igrK27HqUzn7DQ3n/kHx6I%3D'
          BANNER_SEED='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8eac-8211-b73e-9c4eeedaee8b/raw?se=2026-09-23T01%3A09%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=2f4eb5ca-708f-5846-b424-95df87639aee&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A55%3A56Z&ske=2026-09-23T23%3A55%3A56Z&sks=b&skv=2026-02-06&sig=NMyGXz13FM3d5v9iubokYym8tMIonQjR%2BQAFNC0Kk9g%3D'
          FAVICON_SEED='https://sdmntprseasia.oaiusercontent.com/files/00000000-24e0-8207-bed6-c0c5c928108d/raw?se=2026-09-23T01%3A09%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=5356a20f-62b5-5490-946b-30e902d90325&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A36%3A07Z&ske=2026-09-23T23%3A36%3A07Z&sks=b&skv=2026-02-06&sig=lCKfzFUs7rvJILXretyXEAbYmA6B4YFi513WoR9b7KY%3D'

          fetch_asset "$LOGO_LIVE" "$LOGO_SEED" /tmp/gcc-logo-source
          fetch_asset "$BANNER_LIVE" "$BANNER_SEED" /tmp/gcc-banner-source
          fetch_asset "$FAVICON_LIVE" "$FAVICON_SEED" /tmp/gcc-favicon-source

          convert /tmp/gcc-logo-source -resize '1200x600>' -strip public/gcc-market-entry-logo-approved-green-gold-20260923.png
          cp public/gcc-market-entry-logo-approved-green-gold-20260923.png public/gcc-market-entry-approved.png

          convert /tmp/gcc-banner-source -resize '1800x600^' -gravity center -extent 1800x600 -strip -quality 88 public/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp
          cp public/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp public/images/social/gcc-market-entry-approved-banner.webp

          convert /tmp/gcc-favicon-source -resize '256x256^' -gravity center -extent 256x256 -strip public/gcc-market-entry-favicon-approved-green-gold-20260923.png
          convert public/gcc-market-entry-favicon-approved-green-gold-20260923.png -resize 512x512 public/apple-icon.png

          convert public/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp -resize '1200x630^' -gravity center -extent 1200x630 -strip public/images/social/gcc-market-entry-share-1200x630.png
          convert public/images/social/gcc-market-entry-hero-approved-green-gold-20260923.webp -resize '1200x630^' -gravity center -extent 1200x630 -strip -quality 92 public/images/social/gcc-market-entry-whatsapp.jpg

          cp public/images/social/gcc-market-entry-share-1200x630.png app/opengraph-image.png
          cp public/images/social/gcc-market-entry-share-1200x630.png app/twitter-image.png

          # Make the new approved favicon the one browsers actually request.
          sed -i 's#icon: siteUrl + "icon.svg?v=20260920b"#icon: siteUrl + "gcc-market-entry-favicon-approved-green-gold-20260923.png"#g' app/layout.tsx
          sed -i 's#apple: siteUrl + "apple-icon.png?v=20260920b"#apple: siteUrl + "gcc-market-entry-favicon-approved-green-gold-20260923.png"#g' app/layout.tsx

          test -s public/gcc-market-entry-approved.png
          test -s public/images/social/gcc-market-entry-approved-banner.webp
          test -s public/gcc-market-entry-favicon-approved-green-gold-20260923.png
          test -s public/apple-icon.png
          test -s public/images/social/gcc-market-entry-share-1200x630.png
          test -s public/images/social/gcc-market-entry-whatsapp.jpg
          test -s app/opengraph-image.png
          test -s app/twitter-image.png

      - name: Build static export
        run: pnpm build

      - name: Validate routes and fingerprint this release
        run: node scripts/verify-pages.mjs stamp ./out "$GITHUB_SHA" "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: https://gccmarketentry.me/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the release at the custom domain
        timeout-minutes: 15
        run: node scripts/verify-pages.mjs live "https://gccmarketentry.me/" "$GITHUB_SHA"
