name: Validate TGPU Gulf Advisory Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgpu-gulf-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_GA_ID: "G-SYBHPLSVCS"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Build static export
        run: pnpm build

      - name: Confirm core TGPU Gulf routes exist
        run: |
          test -f out/index.html
          test -f out/ar/index.html
          test -f out/bm/index.html
          test -f out/saudi-arabia/index.html
          test -f out/uae/index.html
          test -f out/malaysia-sourcing/index.html
          test -f out/beauty-wellness/index.html
          test -f out/electronics/index.html
          grep -q "TGPU Gulf Advisory" out/index.html
          grep -q "+60 12-868 1339" out/index.html
