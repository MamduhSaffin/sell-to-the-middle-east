name: Deploy GCC Market Entry to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_GA_ID: "G-SYBHPLSVCS"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Prepare exact approved GCC logo only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

          LOGO_SEED='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-0908-8211-881d-72a33cc1f8b2/raw?se=2026-09-23T04%3A46%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=aaccba26-6b46-5a99-a1bc-845697fa6e5e&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A39%3A12Z&ske=2026-09-24T01%3A39%3A12Z&sks=b&skv=2026-02-06&sig=tQbdLTUl8hSREh4JBRFB0YdeD7oJRCVkSI04nnxMvYE%3D'
          LOGO_LIVE='https://gccmarketentry.me/gcc-market-entry-logo-approved-green-gold-20260923.png'

          if curl -fL --retry 3 --connect-timeout 15 "$LOGO_SEED" -o /tmp/gcc-logo-source; then
            echo 'Using the exact APPROVED GCC Market Entry logo from Drive.'
          else
            curl -fL --retry 3 --connect-timeout 15 "$LOGO_LIVE" -o /tmp/gcc-logo-source
          fi
          test -s /tmp/gcc-logo-source

          cp /tmp/gcc-logo-source public/gcc-market-entry-logo-approved-green-gold-20260923.png
          cp /tmp/gcc-logo-source public/gcc-market-entry-approved.png
          convert /tmp/gcc-logo-source -resize '256x256>' -gravity center -background white -extent 256x256 -strip public/gcc-market-entry-favicon-approved-green-gold-20260923.png
          cp public/gcc-market-entry-favicon-approved-green-gold-20260923.png public/apple-icon.png

          test -s public/gcc-market-entry-logo-approved-green-gold-20260923.png
          test -s public/gcc-market-entry-favicon-approved-green-gold-20260923.png

      - name: Build static export
        run: pnpm build

      - name: Validate routes and fingerprint this release
        run: node scripts/verify-pages.mjs stamp ./out "$GITHUB_SHA" "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: https://gccmarketentry.me/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm the release at the custom domain
        timeout-minutes: 15
        run: node scripts/verify-pages.mjs live "https://gccmarketentry.me/" "$GITHUB_SHA"
