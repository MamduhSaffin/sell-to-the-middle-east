<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">GCC Market Entry</title>
  <desc id="desc">Landscape GCC Market Entry logo with Gulf map, gold growth arrow, resource categories and gccmarketentry.me.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d56d"/>
      <stop offset="0.55" stop-color="#d9a72e"/>
      <stop offset="1" stop-color="#b98216"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c6549"/>
      <stop offset="1" stop-color="#004631"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0a2f24" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="#ffffff"/>

  <g filter="url(#softShadow)">
    <text x="72" y="360" font-family="Arial, Helvetica, sans-serif" font-size="330" font-weight="900" letter-spacing="-18" fill="url(#green)">GCC</text>
    <text x="82" y="540" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="-7" fill="url(#green)">Market Entry</text>

    <g transform="translate(930 58) scale(1.23)">
      <path d="M93 10c42 7 80 24 111 48l33 26 18 37 40 26 4 35 28 27-8 41 24 23-17 37-41 4-20 37-38 18-33-18-40 11-36-16-21-38-38-7-16-33-32-26 9-40-18-28 15-39-3-35 30-32 23-42 41-12 25-32Z" fill="url(#green)"/>
      <path d="M101 103c52 1 99 12 145 31M113 157c54 3 103 16 147 39M123 213c44 6 84 18 123 38" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".88"/>
    </g>

    <path d="M690 602c228 2 425-80 604-239" fill="none" stroke="url(#gold)" stroke-width="36" stroke-linecap="round"/>
    <path d="M1277 320l154 31-96 126-5-65-74-18Z" fill="url(#gold)"/>
  </g>

  <text x="800" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="3.5" fill="#064a38">BUSINESS <tspan fill="#d6a431">●</tspan> JOBS <tspan fill="#d6a431">●</tspan> SCHOLARSHIPS <tspan fill="#d6a431">●</tspan> OFFICIAL RESOURCES <tspan fill="#d6a431">●</tspan> MARKET GUIDES</text>

  <line x1="300" y1="735" x2="510" y2="735" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <text x="800" y="754" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" letter-spacing="2" fill="#064a38">gccmarketentry.me</text>
  <line x1="1090" y1="735" x2="1300" y2="735" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
</svg>
