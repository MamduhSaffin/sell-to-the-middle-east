<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">GCC Market Entry</title>
  <desc id="desc">Official GCC Market Entry logo with Gulf map and gold growth arrow.</desc>
  <rect width="700" height="700" rx="70" fill="#fff"/>
  <text x="230" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="900" fill="#075842">GCC</text>
  <!-- stylised Arabian Peninsula / Gulf map -->
  <path d="M402 132c39 9 71 24 98 46l35 31 12 44 29 29-6 35 28 31-18 33-46 7-25 38-45 11-35-25-42 7-28-29-26-56 12-49-17-35 28-50 46-18 30-50Z" fill="#075842"/>
  <path d="M421 210c32 1 63 7 93 19M437 257c39 2 77 12 109 31M447 306c32 5 62 16 91 32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <!-- gold market-entry arrow -->
  <path d="M275 480c97-6 181-45 250-116" fill="none" stroke="#d6a431" stroke-width="24" stroke-linecap="round"/>
  <path d="m505 343 82 12-43 69-5-33-36-6Z" fill="#d6a431"/>
  <text x="252" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="83" font-weight="900" fill="#075842">Market Entry</text>
  <text x="350" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="6" fill="#075842">BUSINESS <tspan fill="#d6a431">●</tspan> JOBS <tspan fill="#d6a431">●</tspan> SCHOLARSHIPS</text>
  <text x="350" y="601" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="4" fill="#075842">OFFICIAL RESOURCES <tspan fill="#d6a431">●</tspan> MARKET GUIDES</text>
  <text x="350" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#075842">gccmarketentry.me</text>
</svg>
