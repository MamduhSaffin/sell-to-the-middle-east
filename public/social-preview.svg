    <text x="0" y="183" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6b64">Official-source-first guides, free tools and verified career links</text>
    <text x="0" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#5d6b64">for Malaysian businesses exploring Saudi Arabia, UAE and the Gulf.</text>

