    <path d="M36 12l12 5-10 8 2-6-6-2z" fill="#fff"/>
    <text x="78" y="24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#123b2c">GCC MARKET ENTRY</text>
