    <text x="35" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#fff">Verify sources.</text>
    <text x="35" y="161" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#fff">Then decide.</text>

