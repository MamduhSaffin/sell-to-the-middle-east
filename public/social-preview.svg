<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GCC Market Entry social preview</title>
  <desc id="desc">Free independent GCC guide for Malaysian businesses.</desc>
  <defs>
