      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#123b2c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="68" r="190" fill="#c59b4f" opacity="0.08"/>
  <circle cx="1040" cy="560" r="260" fill="#123b2c" opacity="0.055"/>

